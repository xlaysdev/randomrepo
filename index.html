<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TWEENSLOP MAKER</title>
<style>
:root{--bg:#101018;--panel:#1a1923;--panel2:#242230;--line:#393646;--pink:#ff68bd;--lime:#c8ff61;--text:#f4f1fa;--muted:#aaa5bb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#14131b;position:sticky;top:0;z-index:3}.logo{font-weight:1000;letter-spacing:.06em;font-size:20px}.logo b{color:var(--pink)}.tag{font-size:10px;letter-spacing:.16em;color:var(--lime);border:1px solid #566238;padding:5px 8px;border-radius:20px}
main{max-width:1180px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.9fr);gap:16px}.previewPanel,.controls{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.previewHead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.13em;color:var(--muted)}.previewWrap{min-height:360px;aspect-ratio:1/1;display:grid;place-items:center;background-color:#20202a;background-image:linear-gradient(45deg,#292936 25%,transparent 25%),linear-gradient(-45deg,#292936 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#292936 75%),linear-gradient(-45deg,transparent 75%,#292936 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;position:relative;overflow:hidden}canvas{width:min(100%,720px);height:auto;aspect-ratio:1;display:block;touch-action:none}.uploadOverlay{position:absolute;inset:12px;border:2px dashed #676174;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#c7c2d3;font-size:13px;pointer-events:none;transition:.15s}.uploadOverlay.hidden{display:none}.uploadOverlay strong{color:white;display:block;font-size:18px;margin-bottom:6px}.previewFoot{padding:12px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}button{border:0;border-radius:10px;padding:11px 14px;font-weight:900;font-size:12px;letter-spacing:.06em;background:var(--pink);color:#23111d;cursor:pointer}button:active{transform:scale(.98)}button.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.lime{background:var(--lime);color:#17200b}.controls{padding:15px;display:flex;flex-direction:column;gap:14px}.controls h2{font-size:13px;letter-spacing:.15em;margin:0 0 2px}.presetRow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.preset{padding:10px 4px;background:var(--panel2);color:var(--text);border:1px solid var(--line);font-size:11px}.preset.active{border-color:var(--pink);background:#382339;color:#ffb1db}.uploadBtn{width:100%;background:var(--lime);color:#17200b}.field{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}.fieldTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px}.fieldTop label{color:#ded9eb}.fieldTop output{color:var(--lime);font-weight:800;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--pink)}.switchrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#d8d3e4;padding:2px 0}.switchrow input{accent-color:var(--pink);width:18px;height:18px}.smallnote{font-size:10px;color:var(--muted);line-height:1.5}.export{width:100%;background:var(--pink);padding:14px}.progress{height:6px;background:#373443;border-radius:10px;overflow:hidden;display:none}.progress div{height:100%;width:0;background:var(--lime);transition:width .2s}.footerline{color:#817b91;font-size:10px;text-align:center;padding:10px 20px 22px}
@media(max-width:820px){main{grid-template-columns:1fr;padding:12px}.previewWrap{min-height:0}.controls{gap:11px}.previewHead{padding:10px}.logo{font-size:17px}}
</style>
</head>
<body>
<header><div class="logo">TWEEN<b>SLOP</b> MAKER</div><span class="tag">IMAGE TWEEN LAB</span></header>
<main>
<section class="previewPanel">
<div class="previewHead"><span>LIVE PREVIEW</span><span id="status">NO IMAGE LOADED</span></div>
<div class="previewWrap" id="dropzone"><canvas id="stage" width="720" height="720"></canvas><div class="uploadOverlay" id="overlay"><div><strong>DROP AN IMAGE HERE</strong>or tap Upload Image below<br><small>PNG · JPG · WEBP</small></div></div></div>
<div class="previewFoot"><button id="playBtn">⏸ PAUSE</button><button class="alt" id="resetBtn">↺ RESET TWEEN</button><button class="alt" id="fitBtn">FIT IMAGE</button></div>
</section>
<aside class="controls">
<h2>IMAGE</h2><input type="file" id="file" accept="image/*" hidden><button class="uploadBtn" id="uploadBtn">＋ UPLOAD IMAGE</button>
<h2>TWEEN STYLE</h2><div class="presetRow"><button class="preset active" data-preset="bounce">BOUNCE</button><button class="preset" data-preset="squish">SQUISH</button><button class="preset" data-preset="wobble">WOBBLE</button></div>
<div class="field"><div class="fieldTop"><label>Intensity</label><output id="intensityOut">80%</output></div><input id="intensity" type="range" min="0" max="100" value="80"></div>
<div class="field"><div class="fieldTop"><label>Speed</label><output id="speedOut">1.0×</output></div><input id="speed" type="range" min="25" max="250" value="100"></div>
<div class="field"><div class="fieldTop"><label>Squash amount</label><output id="squashOut">75%</output></div><input id="squash" type="range" min="0" max="100" value="75"></div>
<div class="field"><div class="fieldTop"><label>Bounce height</label><output id="heightOut">180 px</output></div><input id="height" type="range" min="20" max="300" value="180"></div>
<div class="field"><div class="fieldTop"><label>Wobble</label><output id="wobbleOut">30%</output></div><input id="wobble" type="range" min="0" max="100" value="30"></div>
<div class="switchrow"><label for="loop">Loop forever</label><input id="loop" type="checkbox" checked></div>
<button class="export" id="export">⬇ EXPORT GIF</button><div class="progress" id="progress"><div id="progressFill"></div></div><div class="smallnote" id="exportNote">GIF export renders a short looping animation. Larger images may take a moment.</div>
</aside>
</main><div class="footerline">TWEEN IT. SQUASH IT. MAKE IT SLOP.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script>
(()=>{const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let img=null,playing=true,started=performance.now(),preset='bounce',scaleFit=1,offsetX=0,offsetY=0,dragging=false,dragStart=null,baseX=360,baseY=410;
function fit(){if(!img)return;scaleFit=Math.min(500/img.width,500/img.height,1);baseX=360;baseY=410;draw(performance.now())}
function loadImage(file){if(!file||!file.type.startsWith('image/'))return;let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{img=im;$('overlay').classList.add('hidden');$('status').textContent=file.name.toUpperCase().slice(0,26);started=performance.now();offsetX=offsetY=0;fit();URL.revokeObjectURL(url)};im.src=url}
function params(){return{intensity:+$('intensity').value/100,speed:+$('speed').value/100,squash:+$('squash').value/100,height:+$('height').value,wobble:+$('wobble').value/100}}
function transform(t){let p=params(),time=(t-started)/1000*p.speed,phase=(time%1),sX=1,sY=1,dy=0,rot=0,shake=0;const amp=p.intensity;
if(preset==='bounce'){let b=Math.abs(Math.sin(time*Math.PI));dy=-b*p.height*amp;let hit=Math.pow(Math.max(0,Math.cos(time*Math.PI*2)),16);sX=1+hit*p.squash*.38*amp;sY=1-hit*p.squash*.48*amp;if(Math.sin(time*Math.PI*2)>0){sY+=Math.sin(time*Math.PI*2)*.15*amp;sX-=Math.sin(time*Math.PI*2)*.08*amp}}
else if(preset==='squish'){let q=Math.sin(time*Math.PI*2);sX=1+Math.max(0,q)*p.squash*.65*amp;sY=1-Math.max(0,q)*p.squash*.55*amp;dy=Math.sin(time*Math.PI*2)*p.height*.16*amp}
else{let q=Math.sin(time*Math.PI*2);sX=1+q*p.wobble*.24*amp;sY=1-q*p.wobble*.22*amp;rot=Math.sin(time*Math.PI*4)*p.wobble*.12*amp;shake=Math.sin(time*18)*p.wobble*10*amp;dy=Math.sin(time*2.8)*p.height*.18*amp}
return{sx:sX,sy:sY,dy,rot,shake}}
function draw(t){ctx.clearRect(0,0,720,720);if(!img){ctx.fillStyle='#c4c0d1';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('UPLOAD AN IMAGE TO START',360,360);return}let tr=playing?transform(t):transform(started+0);let w=img.width*scaleFit,h=img.height*scaleFit;ctx.save();ctx.translate(baseX+offsetX+tr.shake,baseY+offsetY+tr.dy);ctx.rotate(tr.rot);ctx.scale(tr.sx,tr.sy);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore()}
function loop(t){if(playing)draw(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
$('uploadBtn').onclick=()=>$('file').click();$('file').onchange=e=>loadImage(e.target.files[0]);$('playBtn').onclick=()=>{playing=!playing;$('playBtn').textContent=playing?'⏸ PAUSE':'▶ PLAY';if(playing)started=performance.now()};$('resetBtn').onclick=()=>{started=performance.now();offsetX=offsetY=0};$('fitBtn').onclick=fit;
document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{preset=b.dataset.preset;document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('active',x===b));started=performance.now()});
[['intensity','intensityOut',v=>v+'%'],['speed','speedOut',v=>(v/100).toFixed(2)+'×'],['squash','squashOut',v=>v+'%'],['height','heightOut',v=>v+' px'],['wobble','wobbleOut',v=>v+'%']].forEach(([id,out,fmt])=>$(id).oninput=()=>$(out).textContent=fmt($(id).value));
const dz=$('dropzone');dz.addEventListener('dragover',e=>{e.preventDefault();$('overlay').style.borderColor='#ff68bd'});dz.addEventListener('dragleave',()=>$('overlay').style.borderColor='');dz.addEventListener('drop',e=>{e.preventDefault();let f=e.dataTransfer.files[0];loadImage(f)});canvas.addEventListener('pointerdown',e=>{if(!img)return;dragging=true;canvas.setPointerCapture(e.pointerId);dragStart={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY}});canvas.addEventListener('pointermove',e=>{if(dragging&&dragStart){offsetX=dragStart.ox+(e.clientX-dragStart.x)*720/canvas.clientWidth;offsetY=dragStart.oy+(e.clientY-dragStart.y)*720/canvas.clientHeight}});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
$('export').onclick=()=>{if(!img){$('exportNote').textContent='Upload an image first!';return}if(!window.GIF){$('exportNote').textContent='GIF library did not load. Check internet and reload.';return}playing=false;$('playBtn').textContent='▶ PLAY';$('export').disabled=true;$('export').textContent='RENDERING GIF...';$('progress').style.display='block';$('progressFill').style.width='0%';let gif=new GIF({workers:2,quality:10,width:720,height:720,workerScript:'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js',repeat:$('loop').checked?0:-1});let savedStarted=started,frames=36,fps=18;for(let i=0;i<frames;i++){let time=savedStarted+i*1000/fps;draw(time);gif.addFrame(ctx,{copy:true,delay:1000/fps})}gif.on('progress',p=>{$('progressFill').style.width=Math.round(p*100)+'%';$('exportNote').textContent='Encoding GIF '+Math.round(p*100)+'%'});gif.on('finished',blob=>{let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='tweenslop.gif';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);$('export').disabled=false;$('export').textContent='⬇ EXPORT GIF';$('exportNote').textContent='GIF saved!';$('progress').style.display='none';playing=true;started=performance.now()});gif.render()};})();
</script>
</body></html>
