<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON DRIVE — 3D Road Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;color:#f5f7ff;font-family:Inter,system-ui,Arial,sans-serif;touch-action:none}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-weight:900;letter-spacing:.16em;font-size:13px;text-shadow:0 2px 14px #000}.brand span{color:#42f5d2}.stats{display:flex;gap:8px}.stat{background:#0b1427bb;border:1px solid #27364c;border-radius:12px;padding:10px 13px;min-width:84px;backdrop-filter:blur(8px)}.stat label{display:block;font-size:9px;color:#9fb1c8;letter-spacing:.14em}.stat strong{font-size:19px;font-weight:800}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}.speedbox{background:#0b1427bb;border:1px solid #27364c;border-radius:18px;padding:12px 16px;backdrop-filter:blur(8px)}#speed{font-size:clamp(32px,7vw,52px);font-weight:900;line-height:1}#speedunit{font-size:10px;color:#a7b7ca;letter-spacing:.15em}.nitro{width:150px;margin-top:8px;height:8px;background:#263249;border-radius:20px;overflow:hidden}.nitro div{height:100%;width:100%;background:linear-gradient(90deg,#43e6c5,#62a7ff);transition:width .1s}.hint{font-size:10px;color:#c1cad8;text-align:right;letter-spacing:.12em;text-shadow:0 2px 6px #000}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#07101acc,#070a12dd);z-index:5;padding:20px}
.card{width:min(520px,100%);text-align:center;border:1px solid #30435a;border-radius:22px;background:#0d1628ee;padding:clamp(20px,5vw,36px);box-shadow:0 20px 90px #0008}
.logo{font-size:12px;letter-spacing:.2em;font-weight:900;color:#45efd0}.card h1{margin:12px 0 8px;font-size:clamp(38px,9vw,64px);line-height:.9;letter-spacing:-.07em}.card h1 em{font-style:normal;color:#4af0d1}.card p{color:#b2bfd1;line-height:1.55;font-size:13px;margin:18px auto;max-width:380px}
button{border:0;cursor:pointer;color:#041512;background:#45efd0;font-weight:900;letter-spacing:.1em;border-radius:12px;padding:15px 22px;font-size:12px}button:active{transform:scale(.97)}.secondary{background:#19263b;color:#dfe9f7;border:1px solid #34455d;margin-top:9px}
#mobile{position:fixed;inset:0;pointer-events:none;display:none;justify-content:space-between;align-items:flex-end;padding:20px 18px calc(18px + env(safe-area-inset-bottom));z-index:3}
.pad{display:flex;gap:12px;pointer-events:auto}.control{width:clamp(62px,18vw,88px);height:clamp(62px,18vw,88px);border-radius:50%;background:#122239cc;border:1px solid #55708b;color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800;backdrop-filter:blur(8px);user-select:none;-webkit-user-select:none;touch-action:none}
.control.gas{width:clamp(70px,20vw,98px);height:clamp(70px,20vw,98px);background:#42e6c5dd;color:#05201a;border-color:#72ffe8}.control.brake{background:#e7596bcc;border-color:#ff9aa6}
#toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(22px,6vw,42px);letter-spacing:.08em;color:#ff6c8b;text-shadow:0 0 24px #ff4768;opacity:0;pointer-events:none;transition:opacity .2s}
@media(max-width:700px){#hud{padding:12px}.stat{padding:8px 10px;min-width:70px}.stat strong{font-size:16px}.bottom{align-items:flex-end}.hint{display:none}.speedbox{padding:10px 12px}#mobile{display:flex}.nitro{width:100px}}
</style>
</head>
<body>
<div id="hud"><div class="top"><div class="brand">NEON <span>DRIVE</span> / ROAD RUSH</div><div class="stats"><div class="stat"><label>DISTANCE</label><strong id="distance">0 m</strong></div><div class="stat"><label>BEST</label><strong id="best">0 m</strong></div></div></div><div class="bottom"><div class="speedbox"><div><span id="speed">0</span> <span id="speedunit">KM/H</span></div><div class="nitro"><div id="nitrobar"></div></div></div><div class="hint">WASD / ARROWS DRIVE · SPACE DRIFT · SHIFT NITRO</div></div></div>
<div id="mobile"><div class="pad"><div class="control" data-key="left">◀</div><div class="control" data-key="right">▶</div></div><div class="pad"><div class="control brake" data-key="brake">▼</div><div class="control gas" data-key="gas">▲</div></div></div>
<div id="toast">CRASH!</div>
<div id="overlay"><div class="card"><div class="logo">NEON DRIVE // ARCADE</div><h1>ROAD<br><em>RUSH</em></h1><p>Drive as far as you can. Dodge traffic, grab the road, hit nitro and don't wipe out. Keyboard on PC, buttons on your phone.</p><button id="start">START ENGINE</button><button id="controls" class="secondary">CONTROLS: WASD / ARROWS · SPACE DRIFT · SHIFT NITRO</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{ 'use strict';
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),speedEl=document.getElementById('speed'),distanceEl=document.getElementById('distance'),bestEl=document.getElementById('best'),nitrobar=document.getElementById('nitrobar'),toast=document.getElementById('toast');
const keys={left:false,right:false,gas:false,brake:false,nitro:false,drift:false};let scene,camera,renderer,player,carGroup,roadSegments=[],traffic=[],props=[],running=false,gameOver=false,velocity=0,steer=0,playerX=0,distance=0,nitro=100,score=0,crashTimer=0,lastTime=0,spawnClock=0,worldSpeed=0,roadWidth=12,lanes=[-3.6,0,3.6],best=0,lights=[];
try{best=Number(localStorage.getItem('neondrive-best')||0)}catch(e){}bestEl.textContent=Math.floor(best)+' m';
function mat(color,rough=.7,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}
const m={road:mat(0x242b38),line:mat(0xe5eaf0),grass:mat(0x152a24),car:mat(0x27d9c1,.35,.25),dark:mat(0x111927),glass:mat(0x172b43,.2,.2),wheel:mat(0x090b10),lamp:mat(0xffdc8c),red:mat(0xff536a),building:mat(0x29364a),white:mat(0xe4ebf8),yellow:mat(0xffca4b)};
function box(w,h,d,material,x=0,y=0,z=0){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;return mesh}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x87a9d1);scene.fog=new THREE.Fog(0x87a9d1,90,280);
 camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,500);camera.position.set(0,5.6,10.5);
 renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);
 const hemi=new THREE.HemisphereLight(0xd7e9ff,0x26341c,2.0);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffe4b6,2);sun.position.set(-25,40,-60);scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),m.grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
 createCar();for(let i=0;i<8;i++)createRoad(i*48-80);for(let i=0;i<22;i++)createSideProps();for(let i=0;i<5;i++)spawnTraffic(true);
 window.addEventListener('resize',resize);requestAnimationFrame(loop);
}
function createCar(){carGroup=new THREE.Group();player=new THREE.Group();carGroup.add(player);scene.add(carGroup);
 player.add(box(1.9,.58,3.8,m.car,0,.72,0));player.add(box(1.45,.75,1.65,m.glass,0,1.3,-.3));player.add(box(1.3,.12,.7,m.white,0,1.65,-.65));
 player.add(box(1.65,.15,.35,m.dark,0,.47,1.75));player.add(box(1.65,.15,.35,m.dark,0,.47,-1.75));
 for(const x of [-1,1])for(const z of [-1.25,1.25]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.26,12),m.wheel);wheel.rotation.z=Math.PI/2;wheel.position.set(x*1.02,.48,z);player.add(wheel)}
 for(const x of [-.62,.62]){const head=box(.34,.16,.1,m.white,x,.85,-1.91);head.material=mat(0xefffff,.2);const tail=box(.32,.14,.1,m.red,x,.75,1.91)}
 player.position.set(0,0,0);carGroup.position.z=5;
}
function createRoad(z){const seg=new THREE.Group();seg.position.z=z;seg.add(box(roadWidth,.12,48,m.road,0,0,0));for(const x of [-roadWidth/2-.15,roadWidth/2+.15])seg.add(box(.25,.22,48,m.white,x,.06,0));
 for(let x=-3.6;x<=3.6;x+=3.6){if(x!==0)for(let z0=-22;z0<24;z0+=12)seg.add(box(.12,.03,5,m.line,x,.08,z0)}
 scene.add(seg);roadSegments.push(seg)}
function createSideProps(){const side=Math.random()<.5?-1:1,z=-Math.random()*260-50;const x=side*(10+Math.random()*18);const group=new THREE.Group();group.position.set(x,0,z);
 if(Math.random()<.6){const trunk=box(.45,2,.45,mat(0x59412c),0,1,0);const crown=new THREE.Mesh(new THREE.ConeGeometry(2.3,4,7),mat(0x1d6848));crown.position.y=3.6;group.add(trunk,crown)}else{const h=5+Math.random()*18,w=4+Math.random()*7;group.add(box(w,h,w,m.building,0,h/2,0));group.add(box(w*.8,.2,w*.8,m.white,0,h*.65,0));}
 scene.add(group);props.push(group)}
function createTrafficCar(color){const g=new THREE.Group(),body=box(1.75,.55,3.1,mat(color,.45,.15),0,.7,0),cab=box(1.35,.7,1.45,m.glass,0,1.18,-.2);g.add(body,cab);for(const x of [-.9,.9])for(const z of [-1,1]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.22,10),m.wheel);w.rotation.z=Math.PI/2;w.position.set(x,.38,z);g.add(w)}return g}
function spawnTraffic(initial=false){const lane=lanes[Math.floor(Math.random()*lanes.length)];const colors=[0xff4d66,0xffc94a,0x6aa7ff,0x9a82ff,0xe4eaf4,0x42d7aa];const car=createTrafficCar(colors[Math.floor(Math.random()*colors.length)]);car.position.set(lane,.0,initial?-120-Math.random()*200:-180-Math.random()*60);scene.add(car);traffic.push({mesh:car,lane,passed:false})}
function reset(){traffic.forEach(t=>scene.remove(t.mesh));traffic=[];roadSegments.forEach((r,i)=>r.position.z=i*48-80);props.forEach(p=>{p.position.z=-Math.random()*260-40;p.position.x=(p.position.x<0?-1:1)*(10+Math.random()*18)});velocity=0;steer=0;playerX=0;distance=0;nitro=100;score=0;spawnClock=0;gameOver=false;running=true;overlay.style.display='none';keys.gas=false;keys.brake=false;keys.nitro=false;keys.drift=false}
function crash(){gameOver=true;running=false;velocity=0;overlay.style.display='grid';document.querySelector('.logo').textContent='RUN ENDED';document.querySelector('.card h1').innerHTML='CRASH<br><em>OUT</em>';document.querySelector('.card p').textContent='Distance: '+Math.floor(distance)+' m. Hit START to jump back into the road.';startBtn.textContent='RESTART';toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,850);if(distance>best){best=distance;bestEl.textContent=Math.floor(best)+' m';try{localStorage.setItem('neondrive-best',String(Math.floor(best)))}catch(e){}}}
function update(dt){if(!running)return;dt=Math.min(dt,.04);
 const acceleration=keys.gas?26:0,braking=keys.brake?42:0,boost=keys.nitro&&nitro>0&&keys.gas;
 velocity+=acceleration*dt;velocity-=braking*dt;if(!keys.gas&&!keys.brake)velocity-=10*dt;velocity=Math.max(-9,Math.min(boost?52:34,velocity));if(boost)nitro=Math.max(0,nitro-27*dt);else nitro=Math.min(100,nitro+8*dt);
 worldSpeed=velocity;distance+=Math.max(0,velocity)*dt*2.5;
 const steerTarget=(keys.left?-1:0)+(keys.right?1:0);steer+=(steerTarget-steer)*Math.min(1,dt*7);playerX+=steer*(keys.drift?9:6.2)*dt*Math.max(.25,Math.abs(velocity)/18);playerX=Math.max(-5.4,Math.min(5.4,playerX));player.position.x=playerX;player.rotation.y=-steer*.15;player.rotation.z=-steer*(keys.drift?.16:.05);
 camera.position.x+=(playerX*.35-camera.position.x)*dt*3;camera.position.y+=(5.8-camera.position.y)*dt*2;camera.position.z=10.5;camera.lookAt(playerX*.2,1,-10);
 roadSegments.forEach(s=>{s.position.z+=velocity*dt*2.2;if(s.position.z>30)s.position.z-=384});
 props.forEach(p=>{p.position.z+=velocity*dt*2.2;if(p.position.z>24){p.position.z=-270-Math.random()*100;p.position.x=(p.position.x<0?-1:1)*(10+Math.random()*18)}});
 traffic.forEach(t=>{t.mesh.position.z+=velocity*dt*2.2;if(!t.passed&&t.mesh.position.z>7){t.passed=true;score+=100}if(t.mesh.position.z>25){scene.remove(t.mesh);t.dead=true}});
 traffic=traffic.filter(t=>!t.dead);
 if(traffic.length<5){spawnClock+=dt;if(spawnClock>1.1){spawnTraffic();spawnClock=0}}
 for(const t of traffic){if(Math.abs(t.mesh.position.z-player.position.z)<2.7&&Math.abs(t.mesh.position.x-playerX)<1.7&&velocity>4){crash();break}}
 speedEl.textContent=Math.round(Math.abs(velocity)*5.4);distanceEl.textContent=Math.floor(distance)+' m';nitrobar.style.width=nitro+'%';
}
function loop(now){const dt=lastTime?(now-lastTime)/1000:0;lastTime=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))}
function setKey(key,on){if(key==='left')keys.left=on;else if(key==='right')keys.right=on;else if(key==='gas')keys.gas=on;else if(key==='brake')keys.brake=on;else if(key==='nitro')keys.nitro=on;else if(key==='drift')keys.drift=on}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')setKey('left',true);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')setKey('right',true);if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')setKey('gas',true);if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')setKey('brake',true);if(e.key==='Shift')setKey('nitro',true);if(e.key===' ')setKey('drift',true)});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')setKey('left',false);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')setKey('right',false);if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')setKey('gas',false);if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')setKey('brake',false);if(e.key==='Shift')setKey('nitro',false);if(e.key===' ')setKey('drift',false)});
document.querySelectorAll('.control').forEach(el=>{const key=el.dataset.key;const down=e=>{e.preventDefault();setKey(key,true)};const up=e=>{e.preventDefault();setKey(key,false)};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)});
startBtn.addEventListener('click',()=>{document.querySelector('.logo').textContent='NEON DRIVE // ARCADE';document.querySelector('.card h1').innerHTML='ROAD<br><em>RUSH</em>';document.querySelector('.card p').textContent='Drive as far as you can. Dodge traffic, grab the road, hit nitro and don’t wipe out. Keyboard on PC, buttons on your phone.';startBtn.textContent='START ENGINE';reset()});
init();
})();
</script>
</body></html>
