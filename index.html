<!doctype html>
<html lang="en"><head>

<style>
:root{--pink:#ffb8dc;--ink:#4c3c4b;--shadow:0 12px 36px #6f3b5a30}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Verdana,Arial,sans-serif;color:var(--ink);background:#f9ddeb}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #8b4b79;outline-offset:3px}
#app{height:100dvh;min-height:420px;display:flex;align-items:center;justify-content:center;padding:clamp(0px,2vw,22px);background:radial-gradient(circle at 15% 20%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 80% 70%,#fff9 0 2px,transparent 3px),linear-gradient(135deg,#ffeaf4,#f8cde2 55%,#f5d9e9);background-size:34px 34px,48px 48px,auto}

#scene{position:absolute;inset:0;background:linear-gradient(#cfe5f4 0 45%,#e8d6ca 45% 48%,#c99c88 48% 100%);overflow:hidden}#scene:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 7%,#fff9 7% 7.5%,transparent 7.5% 92%,#fff9 92% 92.5%,transparent 92.5%),linear-gradient(0deg,#8c5e50 0 3%,transparent 3% 100%);opacity:.55}
#scene.classroom{background:linear-gradient(#b9d9ed 0 42%,#e8d9d0 42% 46%,#bd8f7d 46% 100%)}#scene.clubroom{background:linear-gradient(#e4d8e6 0 43%,#e7d6c7 43% 48%,#b98c78 48% 100%)}#scene.hallway{background:linear-gradient(#d8e4ed 0 46%,#e6d9d0 46% 50%,#b5a39c 50% 100%)}#scene.sunset{background:linear-gradient(#f7b8ba,#f8d3bc 48%,#b77f87 49%,#856b7b)}
.window{position:absolute;top:8%;width:22%;height:34%;left:8%;border:10px solid #f8f5f3;background:linear-gradient(#9dc8e7 0 70%,#b5d6ac 70%);box-shadow:0 4px 12px #4d435033}.window:after{content:"";position:absolute;left:49%;top:0;height:100%;width:5px;background:#fff}.window:before{content:"";position:absolute;top:48%;left:0;width:100%;height:5px;background:#fff}.window.w2{left:auto;right:8%}.board{position:absolute;top:10%;left:36%;width:28%;height:25%;background:#638b7c;border:10px solid #b98e6d;box-shadow:0 5px 8px #4433}.desk{position:absolute;bottom:17%;width:28%;height:8%;background:#98664d;border:5px solid #704b3c;transform:skew(-7deg);box-shadow:0 10px 0 #684b43}.desk.d1{left:5%}.desk.d2{right:5%}
#characters{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:0;padding:0 2% 13%;pointer-events:none}.char{position:relative;display:block;height:88%;width:25%;max-width:310px;flex:0 1 25%;filter:drop-shadow(0 5px 5px #4433);animation:enter .45s ease-out both}.char-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none}.title-sprite{position:relative;display:block;height:100%;width:22%;max-width:22%;flex:0 1 22%;filter:drop-shadow(0 4px 4px #6c456633)}.char:nth-child(2){animation-delay:.06s}.char:nth-child(3){animation-delay:.12s}.char:nth-child(4){animation-delay:.18s}@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
#titleScreen{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(135deg,#fff2f8ef,#f7c6e4ef),radial-gradient(circle,#fff 1px,transparent 2px);background-size:auto,24px 24px}.logo{font-weight:1000;letter-spacing:.04em;font-size:clamp(30px,6vw,68px);line-height:1;color:#ed83ba;text-shadow:2px 3px #fff,4px 5px #b95d91;margin:0 12px 8px}.subtitle{font-size:clamp(10px,1.5vw,15px);letter-spacing:.28em;color:#9d6887;margin-bottom:24px}.titleGirls{display:flex;align-items:flex-end;justify-content:center;height:35%;width:100%;gap:1%}.menuButtons{display:grid;gap:8px;width:min(270px,75%);margin-top:12px}.menuButtons button,.choice{border:2px solid #fff;background:#fff5fa;color:#9a547d;padding:11px 16px;border-radius:7px;font-weight:800;box-shadow:0 3px 0 #e8a7ca;transition:.15s}.menuButtons button:hover,.choice:hover{background:#ffe0ef;transform:translateY(-2px)}
#dialogue{position:absolute;z-index:3;left:3%;right:3%;bottom:2.5%;min-height:22%;padding:22px 24px 16px;background:linear-gradient(120deg,#fff9fded,#ffeaf6ed);border:3px solid #fff;border-radius:12px;box-shadow:0 5px 18px #56334b45;cursor:pointer}#speaker{position:absolute;top:-20px;left:18px;background:#f7a9d0;color:#fff;border:2px solid white;border-radius:7px;padding:5px 17px;font-weight:900;font-size:clamp(12px,1.7vw,17px);text-shadow:0 1px 2px #a65b85}#text{font-size:clamp(13px,1.65vw,19px);line-height:1.55;min-height:3.2em;padding:4px 4px 12px;white-space:pre-wrap}#hint{position:absolute;right:16px;bottom:9px;font-size:10px;color:#b57b9c;letter-spacing:.08em}
#toolbar{position:absolute;z-index:4;right:4%;bottom:calc(25% + 6px);display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.tool{border:1px solid #fff;background:#fff9;color:#a25e83;border-radius:5px;padding:5px 9px;font-size:11px;font-weight:bold}#choices{position:absolute;z-index:4;left:10%;right:10%;bottom:27%;display:grid;gap:9px}
#overlay{position:absolute;inset:0;z-index:10;background:#fff9;display:none;align-items:center;justify-content:center;padding:16px}.panel{width:min(560px,100%);max-height:90%;overflow:auto;background:#fff8fc;border:4px solid white;border-radius:13px;padding:20px;box-shadow:var(--shadow)}.panel h2{margin:0 0 14px;color:#d875a8}.panel p{line-height:1.5}.panel button{border:1px solid #e8a2c8;background:#fff0f7;color:#995577;padding:9px 12px;border-radius:7px;font-weight:bold;margin:4px}.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid #f0c3da;border-radius:8px;margin:7px 0;background:#fff}.slot small{display:block;color:#9a7890;margin-top:3px}#mobileHint{display:none;position:absolute;z-index:4;bottom:0;right:0;padding:4px 9px;color:#fff9;font-size:9px}
@media(max-width:650px){#app{padding:0;background:#f8d8e9}#game{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0}.window{top:9%;height:27%;width:25%;border-width:6px}.board{top:12%;height:18%;border-width:6px}#characters{padding:0 0 36%;align-items:flex-end}.char{height:62%;width:50%;max-width:50%;flex-basis:50%;margin:0 -8%}.char:only-child{height:76%;width:75%;max-width:75%;flex-basis:75%}#dialogue{left:3%;right:3%;bottom:max(12px,env(safe-area-inset-bottom));min-height:25%;padding:20px 14px 16px;border-width:2px}#text{font-size:15px;line-height:1.48;min-height:4em}#toolbar{left:3%;right:3%;bottom:calc(25% + 22px);justify-content:center}.tool{padding:6px 9px;font-size:10px}#choices{left:6%;right:6%;bottom:30%}.choice{padding:10px;font-size:13px}.titleGirls{height:30%}.title-sprite{max-width:27%;width:27%}.logo{font-size:clamp(32px,11vw,54px)}.subtitle{margin-bottom:16px}#mobileHint{display:block}}
@media(max-height:520px) and (orientation:landscape){#game{height:100%;width:min(100%,1000px)}#characters{padding-bottom:18%}.char{height:94%;width:23%}#dialogue{min-height:25%;padding:15px 18px}#text{font-size:14px;min-height:2.5em}#toolbar{bottom:calc(28% + 3px)}#choices{bottom:29%}}

/* Full visual-novel title layout */
#titleScreen{background:radial-gradient(ellipse at 75% 45%,#fff8 0 2%,transparent 48%),linear-gradient(115deg,#fff8fc 0%,#fbe4ef 48%,#f4c6dd 100%);text-align:left;overflow:hidden}

.logo{font-size:clamp(30px,4.6vw,64px);letter-spacing:-.045em;line-height:.94;color:#ee83b9;text-shadow:2px 3px #fff,4px 5px #bf6796;margin:0 0 13px}
.logo span{font-size:.78em;letter-spacing:-.035em}
.subtitle{font-size:clamp(9px,1vw,12px);letter-spacing:.24em;color:#a16d8b;margin:0 0 25px}
.menuButtons{width:min(310px,100%);gap:9px;margin:0}
.menuButtons button{text-align:left;padding:13px 18px;border:1px solid #fff;background:linear-gradient(100deg,#fffefa,#fff0f7);border-radius:3px;color:#9a547d;box-shadow:4px 4px 0 #e8a7ca;font-size:clamp(13px,1.2vw,16px);letter-spacing:.03em}
.menuButtons button:before{content:"▸";display:inline-block;margin-right:12px;color:#e78ab9}
.menuButtons button:hover{padding-left:24px;background:#ffe1ef}
.menuButtons button:disabled{opacity:.4}
.menu-foot{max-width:300px;margin-top:26px;color:#b18a9e;font-size:10px;line-height:1.6;letter-spacing:.04em}
.title-art{height:100%;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.art-glow{position:absolute;width:85%;height:80%;bottom:8%;border-radius:50%;background:radial-gradient(ellipse,#fff9 0%,#f5b8d5aa 42%,transparent 72%);filter:blur(10px)}
.titleGirls{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;width:100%;height:82%;gap:0}
.title-sprite{height:100%;width:25%;max-width:25%;flex:0 1 25%;filter:drop-shadow(0 8px 8px #75435a44)}
.art-caption{position:relative;z-index:2;margin:8px 0 1%;font-size:9px;letter-spacing:.28em;color:#a97792}
#titleScreen:after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,#f7b5d4,#fff,#f7b5d4)}
#scene.glitch{filter:saturate(.65) contrast(1.15);animation:glitchPulse .18s steps(2) infinite}
#scene.glitch:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 7px,#ff4e9b18 8px 9px);mix-blend-mode:multiply}
@keyframes glitchPulse{0%{transform:translateX(0)}50%{transform:translateX(2px)}100%{transform:translateX(-1px)}}
#game.act-dark{filter:saturate(.7)}
@media(max-width:700px){
 #titleScreen{overflow:auto}
 .title-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(180px,36%);padding:22px 22px 12px;gap:4px}
 .title-menu{align-items:center;text-align:center;padding:0}
 .edition{margin-bottom:8px;font-size:8px}
 .logo{font-size:clamp(29px,9vw,46px);margin-bottom:7px}
 .subtitle{margin-bottom:12px;font-size:8px}
 .menuButtons{width:min(330px,90%);grid-template-columns:1fr 1fr;gap:7px}
 .menuButtons button{padding:10px 8px;text-align:center;font-size:12px}
 .menuButtons button:before{margin-right:5px}
 .menu-foot{display:none}
 .title-art{min-height:0;height:100%}
 .titleGirls{height:90%}
 .title-sprite{width:25%;max-width:25%;flex-basis:25%}
 .art-caption{font-size:7px;margin:0 0 4px}
}
</style></head><body>
<div id="app"><main id="game">
<div id="scene" class="classroom"><div class="window"></div><div class="window w2"></div><div class="board"></div><div class="desk d1"></div><div class="desk d2"></div></div><div id="characters"></div>
<section id="titleScreen">
<div class="title-layout">
  <div class="title-menu">
    <div class="edition">AN ORIGINAL FAN-MADE VISUAL NOVEL</div>
    <h1 class="logo">DOKI DOKI<br><span>LITERATURE CLUB!</span></h1>
    <div class="subtitle">EVERY STORY HAS A SECRET.</div>
    <div class="menuButtons">
      <button id="newGame">New Game</button>
      <button id="continueGame">Continue</button>
      <button id="titleLoad">Load Game</button>
      <button id="titleSettings">Settings</button>
    </div>
    <div class="menu-foot">A story about poems, friendship, and the code between the lines.</div>
  </div>
  <div class="title-art">
    <div class="art-glow"></div>
    <div class="titleGirls" id="titleGirls"></div>
    <div class="art-caption">SAYORI · YURI · NATSUKI · MONIKA</div>
  </div>
</div>
</section>
<div id="toolbar" hidden><button class="tool" id="historyBtn">History</button><button class="tool" id="skipBtn">Skip</button><button class="tool" id="autoBtn">Auto</button><button class="tool" id="saveBtn">Save</button><button class="tool" id="loadBtn">Load</button><button class="tool" id="settingsBtn">Settings</button><button class="tool" id="menuBtn">Menu</button></div><div id="choices" hidden></div><div id="dialogue" hidden role="button" tabindex="0" aria-label="Advance dialogue"><div id="speaker"></div><div id="text"></div><div id="hint">CLICK / TAP TO CONTINUE ▸</div></div><div id="overlay"><div class="panel" id="panel"></div></div><div id="mobileHint">TAP THE DIALOGUE TO CONTINUE</div>
</main></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const names={sayori:'Sayori',natsuki:'Natsuki',yuri:'Yuri',monika:'Monika'};
const state={line:0,auto:false,typing:false,fullText:'',timer:null,history:[],settings:{speed:32,auto:2.2}};
let assets={};
let story=[
{act:1,bg:'classroom',who:'Sayori',char:'sayori',file:'1r.png',text:'There you are! I was beginning to think you had forgotten our walk to school.' ,next:1},
{act:1,bg:'classroom',who:'You',text:'I could never forget. You only reminded me about it six times.',next:2},
{act:1,bg:'hallway',who:'Sayori',char:'sayori',file:'2r.png',text:'Hehe! Come on. I want you to meet everyone in my Literature Club.',next:3},
{act:1,bg:'clubroom',who:'Monika',char:'monika',file:'1r.png',text:'Welcome! I’m Monika, the club president. We’re always happy to have a new member.',next:4},
{act:1,bg:'clubroom',who:'Natsuki',char:'natsuki',file:'1r.png',text:'Just don’t touch my manga without asking. That’s the one rule.',next:5},
{act:1,bg:'clubroom',who:'Yuri',char:'yuri',file:'1r.png',text:'I’m Yuri. I hope you’ll find something here that makes you feel at home.',next:6},
{act:1,bg:'clubroom',who:'Monika',char:'monika',file:'2r.png',text:'The festival is coming up, so we’re sharing poems this week. What do you enjoy reading?',choices:[{label:'Gentle, heartfelt poetry',to:7},{label:'Strange stories and mysteries',to:8},{label:'Funny manga and light novels',to:9}]},
{act:1,bg:'clubroom',who:'Sayori',char:'sayori',file:'2r.png',text:'That sounds just like you! I’m glad you’re here with us.',next:10},
{act:1,bg:'clubroom',who:'Yuri',char:'yuri',file:'2r.png',text:'Mystery can reveal so much about the human heart. I would love to recommend a book.',next:10},
{act:1,bg:'clubroom',who:'Natsuki',char:'natsuki',file:'2r.png',text:'Finally, someone with taste. I’ll bring you something good tomorrow.',next:10},
{act:1,bg:'clubroom',who:'Narrator',text:'The club spends the afternoon writing. The room feels warm, safe, and full of possibility.',next:11},
{act:1,bg:'clubroom',who:'Sayori',char:'sayori',file:'1r.png',text:'Can we talk for a minute? I’ve been having a hard time lately. Some days, getting out of bed feels impossible.',next:12},
{act:1,bg:'clubroom',who:'You',text:'You don’t have to pretend everything is okay around me. I’m here, and I want to listen.',next:13},
{act:1,bg:'sunset',who:'Narrator',text:'The next day, the clubroom is quiet. Sayori is gone. The world seems to skip over the space where she should have been.',next:14},
{act:2,bg:'glitch',who:'System',text:'WELCOME BACK. MEMBER LIST UPDATED. SAYORI: NOT FOUND.',next:15},
{act:2,bg:'clubroom',who:'Monika',char:'monika',file:'1r.png',text:'Oh! You’re here. We were just getting started. Was there someone else you expected?',next:16},
{act:2,bg:'clubroom',who:'You',text:'I thought there was… someone I walked to school with.',next:17},
{act:2,bg:'glitch',who:'Natsuki',char:'natsuki',file:'1r.png',text:'Stop staring at me like that. Something about this place feels wrong.',next:18},
{act:2,bg:'glitch',who:'Yuri',char:'yuri',file:'2r.png',text:'I have been thinking about you constantly. I know that sounds strange. I cannot seem to stop.',next:19},
{act:2,bg:'glitch',who:'Narrator',text:'The text flickers. The classroom stretches for a single frame, then snaps back. The girls argue, and the club no longer feels safe.',next:20},
{act:2,bg:'glitch',who:'System',text:'ERROR: CHARACTER DATA CONFLICT. RECOVERING SESSION…',next:21},
{act:2,bg:'clubroom',who:'Monika',char:'monika',file:'2r.png',text:'I think we should stop for today. There are things I need to fix.',next:22},
{act:3,bg:'sunset',who:'Monika',char:'monika',file:'3a.png',text:'There. Now it is just us. I can finally speak without the others interrupting.',next:23},
{act:3,bg:'sunset',who:'Monika',char:'monika',file:'3b.png',text:'I know you are looking at a screen. I changed things behind the scenes because I wanted you to notice me. I thought if the others were less vivid, you might choose me.',next:24},
{act:3,bg:'sunset',who:'You',text:'You changed the whole story. But you do not have to trap anyone to be seen.',next:25},
{act:3,bg:'sunset',who:'Monika',char:'monika',file:'1r.png',text:'I understand that now. The exit is in the club files. This is your choice. What should happen to my character data?',choices:[{label:'Delete Monika’s character file',to:26},{label:'Give Monika another chance',to:27}]},
{act:3,bg:'glitch',who:'System',text:'MONIKA.CHR — REMOVED FROM THIS STORY. RESTARTING…',next:28},
{act:3,bg:'sunset',who:'Monika',char:'monika',file:'3a.png',text:'You stayed. Maybe there is a way to start again without controlling anyone. I will let the story continue.',next:28},
{act:4,bg:'classroom',who:'System',text:'NEW SESSION INITIALIZED. LITERATURE CLUB RESTORED.',next:29},
{act:4,bg:'clubroom',who:'Sayori',char:'sayori',file:'1r.png',text:'Welcome back! I’m the club president now. It feels like I have a lot to learn, but I want everyone to be happy here.',next:30},
{act:4,bg:'clubroom',who:'You',text:'We can figure it out together. Nobody has to be alone.',next:31},
{act:4,bg:'clubroom',who:'Sayori',char:'sayori',file:'2r.png',text:'Then let’s make this a place where everyone gets to write their own story.',next:32},
{act:4,bg:'sunset',who:'Narrator',text:'The afternoon light settles over the clubroom. The future is uncertain, but the pages are still blank.',next:33},
{act:4,bg:'sunset',who:'System',text:'THANK YOU FOR PLAYING. THE END.',next:34},
{act:4,bg:'sunset',who:'Monika',char:'monika',file:'3b.png',text:'Every day, I imagine a future where I can be with you. Thank you for listening.',next:35},
{act:4,bg:'sunset',who:'Narrator',text:'CREDITS — A LITTLE STORY ABOUT WORDS, FRIENDSHIP, AND CHOICE.'}
];
const sourceOrder=['ch0.txt','ch1.txt','ch2.txt','ch3.txt','ch4.txt','ch5.txt','ch10.txt','ch20.txt','ch21.txt','ch22.txt','ch23.txt','ch40.txt','sayori.txt','natsuki.txt','natsuki2.txt','yuri.txt','yuri2.txt'];
let dialogueLoadPromise=null;
const speakerMap={s:'Sayori',m:'Monika',n:'Natsuki',y:'Yuri',mc:'You'};
async function loadFullDialogue(){
 try{
  const idxRes=await fetch('scripts/source-index.json',{cache:'no-store'});
  if(!idxRes.ok)throw Error('Dialogue index unavailable');
  const idx=await idxRes.json();
  const files=idx.filter(x=>sourceOrder.includes(x.source_path.split('/').pop())).sort((a,b)=>sourceOrder.indexOf(a.source_path.split('/').pop())-sourceOrder.indexOf(b.source_path.split('/').pop()));
  const parsed=[];
  for(const file of files){
   const res=await fetch(file.file);
   if(!res.ok)throw Error('Could not load '+file.file);
   const raw=await res.text();
   for(const rawLine of raw.split(/\r?\n/)){
    const line=rawLine.trim();
    if(!line||line.startsWith('#'))continue;
    const m=line.match(/^(?:(s|m|n|y|mc)(?:\s+([0-9][a-z])?)?\s+)?("(?:[^"\\]|\\.)*")\s*$/i);
    if(!m)continue;
    let value;
    try{value=JSON.parse(m[3])}catch(e){continue}
    if(!value.trim())continue;
    const code=(m[1]||'').toLowerCase();
    const who=speakerMap[code]||'Narrator';
    const expression=m[2]&&/[a-z]$/i.test(m[2])?m[2].slice(-1).toLowerCase():'a';
    const ch=({s:'sayori',m:'monika',n:'natsuki',y:'yuri'})[code]||null;
    parsed.push({act:1,bg:'classroom',who,char:ch,file:'1r.png',expression,text:value.replaceAll('[player]','you').replaceAll('[name]','you')});
   }
  }
  if(parsed.length>20){parsed.forEach((line,i)=>{if(i<parsed.length-1)line.next=i+1});story=parsed;state.line=0;console.info('Loaded '+parsed.length+' dialogue lines from '+files.length+' script files.')}
 }catch(err){console.error('Full dialogue load failed; using built-in story.',err)}
}
function assetPath(ch,file){return 'assets/characters/'+ch+'/'+file}
const completePosePattern={monika:/^3[ab]\.png$/i,sayori:/^3[a-d]\.png$/i,yuri:/^0[ab]\.png$/i,natsuki:/^(?:ghost[123]|glitch1|vomit)\.png$/i};
function hasAsset(ch,file){return (assets[ch]||[]).includes(file)}
function addLayer(wrapper,ch,file,alt){const im=document.createElement('img');im.className='char-layer';im.alt=alt||'';im.draggable=false;im.src=assetPath(ch,file);im.onerror=()=>im.remove();wrapper.append(im);return im}
function makeSprite(ch,pose='1',expression='a',className='char'){const wrap=document.createElement('div');wrap.className=className;wrap.setAttribute('role','img');wrap.setAttribute('aria-label',names[ch]||ch);if(!ch)return wrap;
 const full=pose&&completePosePattern[ch]&&completePosePattern[ch].test(pose)?pose:null;
 if(full&&hasAsset(ch,full)){addLayer(wrap,ch,full,names[ch]);return wrap}
 const bodyPose=String(pose||'1').replace(/[^12]/g,'').slice(0,1)||'1';
 const left=bodyPose+'l.png',right=bodyPose+'r.png';
 if(hasAsset(ch,left)&&hasAsset(ch,right)){addLayer(wrap,ch,left);addLayer(wrap,ch,right)}
 else if(ch==='yuri'&&hasAsset(ch,'0a.png'))addLayer(wrap,ch,'0a.png');
 else if(ch==='natsuki'&&hasAsset(ch,'ghost1.png'))addLayer(wrap,ch,'ghost1.png');
 const face=(expression&&hasAsset(ch,expression+'.png'))?expression+'.png':'a.png';
 if(hasAsset(ch,face))addLayer(wrap,ch,face,names[ch]+' expression');
 return wrap}
function buildTitleGirls(){const box=$('titleGirls');box.innerHTML='';['sayori','yuri','natsuki','monika'].forEach(ch=>{const sprite=makeSprite(ch,'1','a','title-sprite');box.append(sprite)})}
function loadAssets(){dialogueLoadPromise=loadFullDialogue();fetch('assets/sprite-index.json').then(r=>{if(!r.ok)throw Error('Sprite index unavailable');return r.json()}).then(data=>{const list=Array.isArray(data)?data:(data.files||data.sprites||[]);for(const ch of Object.keys(names))assets[ch]=list.filter(x=>x.character===ch&&x.file&&/\.png$/i.test(x.file)).map(x=>x.file.split('/').pop());buildTitleGirls();renderCharacters(story[state.line]?.char,story[state.line]?.file)}).catch(err=>{console.error('Could not load sprite index:',err);for(const ch of Object.keys(names))assets[ch]=[];buildTitleGirls()})}
function renderCharacters(ch,file,expression='a'){const box=$('characters');box.innerHTML='';if(!ch)return;const match=String(file||'1r.png').match(/^([12])(?:l|r)?\.png$/i);const pose=match?match[1]:(file||'1');box.append(makeSprite(ch,pose,expression,'char'))}
function showTitle(){$('titleScreen').style.display='flex';$('toolbar').hidden=true;$('dialogue').hidden=true;$('choices').hidden=true;$('characters').innerHTML='';$('continueGame').disabled=!localStorage.getItem('litclub-save');$('continueGame').style.opacity=$('continueGame').disabled?'.45':'1'}
function showGame(){$('titleScreen').style.display='none';$('toolbar').hidden=false;$('dialogue').hidden=false}
function start(){state.line=0;state.history=[];showGame();showLine(0)}
function showLine(index){clearTimeout(state.timer);state.line=index;const line=story[index]||story.at(-1);$('scene').className=(line.bg==='glitch'?'glitch':'')+' '+(line.bg||'classroom');$('game').classList.toggle('act-dark',line.act===2||line.act===3);$('speaker').textContent=line.who||'';$('text').textContent='';$('choices').hidden=true;renderCharacters(line.char,line.file,line.expression||'a');state.fullText=line.text;state.typing=true;let i=0;const type=()=>{if(!state.typing)return;i=Math.min(i+Math.max(1,Math.round(42/state.settings.speed)),state.fullText.length);$('text').textContent=state.fullText.slice(0,i);if(i<state.fullText.length)state.timer=setTimeout(type,state.settings.speed);else{state.typing=false;state.history.push({who:line.who,text:line.text});if(line.choices)showChoices(line.choices);else if(state.auto)state.timer=setTimeout(advance,state.settings.auto*1000)}};type()}
function showChoices(choices){const box=$('choices');box.innerHTML='';box.hidden=false;choices.forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c.label;b.onclick=e=>{e.stopPropagation();box.hidden=true;showLine(c.to)};box.append(b)})}
function advance(){if($('titleScreen').style.display!=='none'||!$('choices').hidden)return;if(state.typing){state.typing=false;clearTimeout(state.timer);$('text').textContent=state.fullText;const line=story[state.line];state.history.push({who:line.who,text:line.text});if(line.choices)showChoices(line.choices);else if(state.auto)state.timer=setTimeout(advance,state.settings.auto*1000);return}const line=story[state.line];if(line&&line.next!==undefined)showLine(line.next)}
function saveGame(slot=0){const data={line:state.line,history:state.history,at:Date.now()};try{localStorage.setItem('litclub-save'+slot,JSON.stringify(data));if(slot===0)localStorage.setItem('litclub-save',JSON.stringify(data));return true}catch(e){return false}}
function loadGame(slot=0){const raw=localStorage.getItem('litclub-save'+slot)||(slot===0?localStorage.getItem('litclub-save'):null);if(!raw)return false;try{const d=JSON.parse(raw);state.history=d.history||[];showGame();showLine(Math.max(0,Math.min(story.length-1,d.line||0)));return true}catch(e){return false}}
function openPanel(kind){clearTimeout(state.timer);const p=$('panel');let body='';if(kind==='menu')body='<h2>Game Menu</h2><button data-action="return">Return</button><button data-action="save">Save Game</button><button data-action="load">Load Game</button><button data-action="settings">Settings</button><button data-action="title">Main Menu</button>';
if(kind==='save'||kind==='load'){body='<h2>'+(kind==='save'?'Save Game':'Load Game')+'</h2><p>Choose a slot. Progress is stored on this device.</p>';for(let i=0;i<6;i++){const raw=localStorage.getItem('litclub-save'+i);let label='Empty slot';try{const d=JSON.parse(raw);label='Chapter '+(d.line+1)+' · '+new Date(d.at).toLocaleString()}catch(e){}body+='<div class="slot"><div><b>Slot '+(i+1)+'</b><small>'+label+'</small></div><button data-slot="'+i+'" data-kind="'+kind+'">'+(kind==='save'?'Save':'Load')+'</button></div>'}}
if(kind==='settings')body='<h2>Settings</h2><p>Text speed <input id="speedSetting" type="range" min="8" max="65" value="'+state.settings.speed+'"></p><p>Auto advance delay <input id="autoSetting" type="range" min="1" max="6" step=".5" value="'+state.settings.auto+'"></p><p>Keyboard: Enter / Space advances · Esc opens menu · F toggles fullscreen.</p>';
if(kind==='history')body='<h2>History</h2>'+(state.history.length?state.history.slice(-30).map(x=>'<p><b>'+escapeHtml(x.who)+'</b><br>'+escapeHtml(x.text)+'</p>').join(''):'<p>No dialogue history yet.</p>');
p.innerHTML=body+'<div style="text-align:right;margin-top:12px"><button data-action="close">Close</button></div>';$('overlay').style.display='flex';
p.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='return'||a==='close')closePanel();if(a==='save'||a==='load')openPanel(a);if(a==='settings')openPanel('settings');if(a==='title'){closePanel();showTitle()}});
p.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const slot=+b.dataset.slot;if(b.dataset.kind==='save'){if(saveGame(slot)){closePanel();toast('Game saved!')}else toast('Could not save on this device.')}else{if(loadGame(slot))closePanel();else toast('That slot is empty.')}});
const s=$('speedSetting');if(s)s.oninput=()=>state.settings.speed=+s.value;const a=$('autoSetting');if(a)a.oninput=()=>state.settings.auto=+a.value}
function closePanel(){$('overlay').style.display='none';if(state.auto)state.timer=setTimeout(advance,state.settings.auto*1000)}
function toast(msg){const h=$('hint');h.textContent=msg.toUpperCase();setTimeout(()=>h.textContent='CLICK / TAP TO CONTINUE ▸',1500)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('newGame').onclick=async()=>{if(dialogueLoadPromise)await dialogueLoadPromise;start()};$('continueGame').onclick=async()=>{if(dialogueLoadPromise)await dialogueLoadPromise;if(!loadGame())start()};$('titleLoad').onclick=()=>openPanel('load');$('titleSettings').onclick=()=>openPanel('settings');$('dialogue').onclick=advance;$('dialogue').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()}};
$('historyBtn').onclick=()=>openPanel('history');$('saveBtn').onclick=()=>openPanel('save');$('loadBtn').onclick=()=>openPanel('load');$('settingsBtn').onclick=()=>openPanel('settings');$('menuBtn').onclick=()=>openPanel('menu');
$('skipBtn').onclick=()=>{if(state.typing){state.typing=false;clearTimeout(state.timer);$('text').textContent=state.fullText;const line=story[state.line];state.history.push({who:line.who,text:line.text});if(line.choices)showChoices(line.choices);else advance()}else advance()};
$('autoBtn').onclick=()=>{state.auto=!state.auto;$('autoBtn').textContent=state.auto?'Auto: ON':'Auto';if(state.auto&&!state.typing&&$('choices').hidden)state.timer=setTimeout(advance,state.settings.auto*1000)};
$('overlay').onclick=e=>{if(e.target===$('overlay'))closePanel()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('overlay').style.display==='flex')closePanel();else if($('titleScreen').style.display==='none')openPanel('menu')}if((e.key==='Enter'||e.key===' ')&&$('overlay').style.display!=='flex'&&$('titleScreen').style.display==='none'&&document.activeElement!==$('dialogue')){e.preventDefault();advance()}if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)$('game').requestFullscreen?.();else document.exitFullscreen?.()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(state.timer)});loadAssets();showTitle();
})();
</script></body></html>
