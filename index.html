<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON DRIVE — 3D Road Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;color:#f5f7ff;font-family:Inter,system-ui,Arial,sans-serif;touch-action:none}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-weight:900;letter-spacing:.16em;font-size:13px;text-shadow:0 2px 14px #000}.brand span{color:#42f5d2}.stats{display:flex;gap:8px}.stat{background:#0b1427bb;border:1px solid #27364c;border-radius:12px;padding:10px 13px;min-width:84px;backdrop-filter:blur(8px)}.stat label{display:block;font-size:9px;color:#9fb1c8;letter-spacing:.14em}.stat strong{font-size:19px;font-weight:800}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}.speedbox{background:#0b1427bb;border:1px solid #27364c;border-radius:18px;padding:12px 16px;backdrop-filter:blur(8px)}#speed{font-size:clamp(32px,7vw,52px);font-weight:900;line-height:1}#speedunit{font-size:10px;color:#a7b7ca;letter-spacing:.15em}.nitro{width:150px;margin-top:8px;height:8px;background:#263249;border-radius:20px;overflow:hidden}.nitro div{height:100%;width:100%;background:linear-gradient(90deg,#43e6c5,#62a7ff);transition:width .1s}.hint{font-size:10px;color:#c1cad8;text-align:right;letter-spacing:.12em;text-shadow:0 2px 6px #000}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#07101acc,#070a12dd);z-index:5;padding:20px}
.card{width:min(520px,100%);text-align:center;border:1px solid #30435a;border-radius:22px;background:#0d1628ee;padding:clamp(20px,5vw,36px);box-shadow:0 20px 90px #0008}
.logo{font-size:12px;letter-spacing:.2em;font-weight:900;color:#45efd0}.card h1{margin:12px 0 8px;font-size:clamp(38px,9vw,64px);line-height:.9;letter-spacing:-.07em}.card h1 em{font-style:normal;color:#4af0d1}.card p{color:#b2bfd1;line-height:1.55;font-size:13px;margin:18px auto;max-width:380px}
button{border:0;cursor:pointer;color:#041512;background:#45efd0;font-weight:900;letter-spacing:.1em;border-radius:12px;padding:15px 22px;font-size:12px}button:active{transform:scale(.97)}.secondary{background:#19263b;color:#dfe9f7;border:1px solid #34455d;margin-top:9px}
#mobile{position:fixed;inset:0;pointer-events:none;display:none;justify-content:space-between;align-items:flex-end;padding:20px 18px calc(18px + env(safe-area-inset-bottom));z-index:3}
.pad{display:flex;gap:12px;pointer-events:auto}.control{width:clamp(62px,18vw,88px);height:clamp(62px,18vw,88px);border-radius:50%;background:#122239cc;border:1px solid #55708b;color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800;backdrop-filter:blur(8px);user-select:none;-webkit-user-select:none;touch-action:none}
.control.gas{width:clamp(70px,20vw,98px);height:clamp(70px,20vw,98px);background:#42e6c5dd;color:#05201a;border-color:#72ffe8}.control.brake{background:#e7596bcc;border-color:#ff9aa6}
#toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(22px,6vw,42px);letter-spacing:.08em;color:#ff6c8b;text-shadow:0 0 24px #ff4768;opacity:0;pointer-events:none;transition:opacity .2s}
@media(max-width:700px){#hud{padding:12px}.stat{padding:8px 10px;min-width:70px}.stat strong{font-size:16px}.bottom{position:absolute;left:12px;bottom:calc(112px + env(safe-area-inset-bottom));align-items:flex-end}.hint{display:none}.speedbox{padding:10px 12px}#mobile{display:flex}.nitro{width:100px}}
</style>
</head>
<body>
<div id="hud"><div class="top"><div class="brand">NEON <span>DRIVE</span> / FREE ROAM<br><small id="vehicleName">SPORT COUPE</small></div><div class="stats"><div class="stat"><label>DISTANCE</label><strong id="distance">0 m</strong></div><div class="stat"><label>BEST</label><strong id="best">0 m</strong></div></div></div><div class="bottom"><div class="speedbox"><div><span id="speed">0</span> <span id="speedunit">KM/H</span></div><div class="nitro"><div id="nitrobar"></div></div></div><div class="hint">WASD DRIVE · SPACE DRIFT · SHIFT NITRO · V/C VEHICLES</div></div></div>
<div id="mobile"><div class="pad"><div class="control" data-key="left">◀</div><div class="control" data-key="right">▶</div></div><div class="pad"><div class="control brake" data-key="brake">▼</div><div class="control gas" data-key="gas">▲</div><button class="control swap" id="prevCar">◁</button><button class="control swap" id="nextCar">▷</button></div></div>
<div id="toast">CRASH!</div>
<div id="overlay"><div class="card"><div class="logo">NEON DRIVE // ARCADE</div><h1>ROAD<br><em>RUSH</em></h1><p>Drive as far as you can. Dodge traffic, grab the road, hit nitro and don't wipe out. Keyboard on PC, buttons on your phone.</p><button id="start">START ENGINE</button><button id="controls" class="secondary">CONTROLS: WASD / ARROWS · SPACE DRIFT · SHIFT NITRO</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id),start=$('start'),overlay=$('overlay'),speed=$('speed'),dist=$('distance'),bestEl=$('best'),nitroBar=$('nitrobar'),vehicleName=$('vehicleName');const keys={left:false,right:false,gas:false,brake:false,nitro:false,drift:false};
let scene,camera,renderer,car,traffic=[],running=false,last=0,v=0,steer=0,x=0,z=0,angle=0,meters=0,nitro=100,best=0,spawn=0,choice=0,spec;
const cars=[{name:'SPORT COUPE',kind:'car',color:0x27d9c1,max:205,acc:32,turn:2.2},{name:'STREET BIKE',kind:'bike',color:0xffb52e,max:240,acc:42,turn:3.4},{name:'RALLY SUV',kind:'suv',color:0x65a3ff,max:170,acc:26,turn:1.8},{name:'PICKUP 4X4',kind:'truck',color:0xff6b91,max:155,acc:23,turn:1.6},{name:'HYPERCAR',kind:'super',color:0xa78bff,max:280,acc:47,turn:2.05},{name:'DIRT BUGGY',kind:'buggy',color:0xffd85a,max:165,acc:30,turn:2.8}];
try{best=Number(localStorage.getItem('neondrive-open-best')||0)}catch(e){}bestEl.textContent=Math.floor(best)+' m';
function mat(c,r=.7,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}
const M={grass:mat(0x24533c),road:mat(0x252b35),glass:mat(0x172c45,.25,.2),rubber:mat(0x090b10),tree:mat(0x287449),trunk:mat(0x60442c),build:[0x556174,0x66768b,0x8b7965,0x626d7a,0x8b8c9a].map(c=>mat(c)),white:mat(0xe7efff),red:mat(0xff465b)};
function box(w,h,d,m,a=0,b=0,c=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(a,b,c);return o}
function tree(a,c){let g=new THREE.Group();g.position.set(a,0,c);g.add(box(.4,2,.4,M.trunk,0,1,0));let cone=new THREE.Mesh(new THREE.ConeGeometry(2.2,4.5,7),M.tree);cone.position.y=3.5;g.add(cone);scene.add(g)}
function world(){let ground=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),M.grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.1;scene.add(ground);
for(let a=-8;a<=8;a++)for(let b=-8;b<=8;b++){let cx=a*60,cz=b*60;scene.add(box(60,.04,16,M.road,cx,0,cz));scene.add(box(16,.04,60,M.road,cx,0,cz));
if((a+b)%5===0){for(let k=0;k<3;k++)tree(cx+(Math.random()-.5)*40,cz+(Math.random()-.5)*40)}else if(Math.abs(a)%5===0||Math.abs(b)%5===0){tree(cx+18,cz-15);tree(cx-16,cz+14)}else{let w=10+Math.random()*10,d=10+Math.random()*10,h=8+Math.random()*26,g=new THREE.Group();g.position.set(cx+(Math.random()-.5)*20,0,cz+(Math.random()-.5)*20);g.add(box(w,h,d,M.build[Math.floor(Math.random()*M.build.length)],0,h/2,0));for(let yy=3;yy<h-2;yy+=4)for(let xx=-w/2+1;xx<w/2-1;xx+=3)g.add(box(1.2,1.4,.06,M.glass,xx,yy,d/2));scene.add(g)}}}
function wheel(g,a,b,c,r=.4){let w=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.23,12),M.rubber);w.rotation.z=Math.PI/2;w.position.set(a,b,c);g.add(w)}
function build(s){let g=new THREE.Group(),body=new THREE.Group(),paint=mat(s.color,.32,.25);g.add(body);
if(s.kind==='bike'){wheel(body,0,.42,-1.05,.45);wheel(body,0,.42,1.05,.45);body.add(box(.36,.65,1.3,paint,0,.85,0));body.add(box(.5,.2,.6,M.glass,0,1.25,-.1));body.add(box(.42,.4,.4,paint,0,1.48,-.35));body.add(box(.42,.7,.4,M.build[0],0,1.65,.2))}
else{let width=s.kind==='truck'?2.2:2,length=s.kind==='super'?4.5:4;body.add(box(width,.65,length,paint,0,.68,0));body.add(box(width*.78,.85,1.8,M.glass,0,1.25,-.1));if(s.kind==='truck'){body.add(box(width,.5,1.4,paint,0,.8,1.2));body.add(box(width,.08,1.2,M.rubber,0,.5,1.2))}if(s.kind==='buggy'){body.add(box(.1,.1,2.4,M.rubber,0,1.7,0));body.add(box(.1,.1,1.5,M.rubber,-.8,1.5,0));body.add(box(.1,.1,1.5,M.rubber,.8,1.5,0))}for(let a of [-width/2-.05,width/2+.05])for(let c of [-1.2,1.2])wheel(body,a,.45,c,s.kind==='buggy'?.52:.42);body.add(box(width*.7,.14,.25,M.white,0,.85,-2));body.add(box(width*.7,.15,.25,M.red,0,.75,2))}
return g}
function setCar(i){choice=(i+cars.length)%cars.length;spec=cars[choice];if(car)scene.remove(car);car=build(spec);scene.add(car);vehicleName.textContent=spec.name;v=0}
function spawn(){let lx=[-9,-3,3,9][Math.floor(Math.random()*4)],s={kind:['car','suv','truck','bike'][Math.floor(Math.random()*4)],color:[0xf04c62,0x49a3f5,0xeac24b,0xdddde5,0x45c99c][Math.floor(Math.random()*5)]},o=build(s);o.position.set(lx,0,z-110-Math.random()*270);o.rotation.y=Math.random()<.5?0:Math.PI;scene.add(o);traffic.push({o,dir:Math.random()<.5?-1:1})}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x87b7e0);scene.fog=new THREE.Fog(0x87b7e0,240,900);camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1400);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdcecff,0x33462b,2.2));let sun=new THREE.DirectionalLight(0xffe6bd,2);sun.position.set(-90,160,-100);scene.add(sun);world();setCar(0);for(let i=0;i<12;i++)spawn();addEventListener('resize',resize);requestAnimationFrame(loop)}
function reset(){x=0;z=0;angle=0;v=0;steer=0;meters=0;nitro=100;spawn=0;traffic.forEach(t=>scene.remove(t.o));traffic=[];for(let i=0;i<10;i++)spawn();running=true;overlay.style.display='none';for(let k in keys)keys[k]=false}
function crash(){running=false;overlay.style.display='grid';document.querySelector('.logo').textContent='FREE ROAM // WRECKED';document.querySelector('.card h1').innerHTML='WRECK<br><em>ED</em>';document.querySelector('.card p').textContent='Traffic collision. Pick another ride or restart.';start.textContent='DRIVE AGAIN';if(meters>best){best=meters;bestEl.textContent=Math.floor(best)+' m';try{localStorage.setItem('neondrive-open-best',Math.floor(best))}catch(e){}}}
function update(dt){if(!running)return;dt=Math.min(dt,.04);let boost=keys.nitro&&keys.gas&&nitro>0;v+=(keys.gas?spec.acc:0)*dt;v-=(keys.brake?44:0)*dt;if(!keys.gas&&!keys.brake)v-=7*dt;v=Math.max(-24,Math.min(boost?spec.max+45:spec.max,v));nitro=boost?Math.max(0,nitro-25*dt):Math.min(100,nitro+9*dt);let target=(keys.left?-1:0)+(keys.right?1:0);steer+=(target-steer)*Math.min(1,dt*5);angle+=steer*spec.turn*dt*Math.min(1,Math.abs(v)/22)*(keys.drift?1.5:1);let speed=v*.16;x+=Math.sin(angle)*speed*dt;z-=Math.cos(angle)*speed*dt;meters+=Math.max(0,v)*dt*.18;car.position.set(x,0,z);car.rotation.y=angle;car.rotation.z=-steer*(keys.drift?.16:.05);camera.position.x+=(x-Math.sin(angle)*12-camera.position.x)*dt*2.8;camera.position.z+=(z-Math.cos(angle)*12-camera.position.z)*dt*2.8;camera.position.y+=(7.5-camera.position.y)*dt*2;camera.lookAt(x,1.2,z);
traffic.forEach(t=>{t.o.position.z+=t.dir*dt*9;if(t.o.position.z>z+130)t.o.position.z=z-260;if(t.o.position.z<z-280)t.o.position.z=z+130;if(Math.abs(t.o.position.x-x)<2.3&&Math.abs(t.o.position.z-z)<3.3&&Math.abs(v)>12)crash()});spawn+=dt;if(traffic.length<18&&spawn>1.5){spawn();spawn=0}speed.textContent=Math.round(Math.abs(v));dist.textContent=Math.floor(meters)+' m';nitroBar.style.width=nitro+'%'}
function loop(now){let dt=last?(now-last)/1000:0;last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.4))}
function key(k,on){if(k in keys)keys[k]=on}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();let k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')key('left',true);if(k==='d'||k==='arrowright')key('right',true);if(k==='w'||k==='arrowup')key('gas',true);if(k==='s'||k==='arrowdown')key('brake',true);if(k==='shift')key('nitro',true);if(k===' ')key('drift',true);if(k==='v')setCar(choice+1);if(k==='c')setCar(choice-1)});
addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')key('left',false);if(k==='d'||k==='arrowright')key('right',false);if(k==='w'||k==='arrowup')key('gas',false);if(k==='s'||k==='arrowdown')key('brake',false);if(k==='shift')key('nitro',false);if(k===' ')key('drift',false)});
document.querySelectorAll('.control').forEach(el=>{let k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);key(k,true)});let release=e=>{e.preventDefault();key(k,false)};el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release)});
$('nextCar').onclick=()=>setCar(choice+1;$('prevCar').onclick=()=>setCar(choice-1);
start.onclick=()=>{document.querySelector('.logo').textContent='NEON DRIVE // FREE ROAM';document.querySelector('.card h1').innerHTML='OPEN<br><em>WORLD</em>';document.querySelector('.card p').textContent='Explore city streets, roads, parks, and countryside. Pick a ride and roam.';start.textContent='ENTER WORLD';reset()};init();
})();
</script>
</body></html>
